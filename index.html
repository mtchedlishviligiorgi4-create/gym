<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<title>Gym</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f2f2f7;--white:#fff;--text:#1c1c1e;--text2:#3a3a3c;--text3:#8e8e93;
  --border:#e5e5ea;--blue:#007aff;--blue-bg:#e8f0fe;--green:#34c759;
  --green-bg:#e8faea;--orange:#ff9500;--orange-bg:#fff4e6;--purple:#af52de;
  --purple-bg:#f5eefa;--red:#ff3b30;--red-bg:#ffedec;--r:14px;
  --shadow:0 1px 3px rgba(0,0,0,.04),0 1px 2px rgba(0,0,0,.06);
}
body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;
  background:var(--bg);color:var(--text);line-height:1.48;
  -webkit-font-smoothing:antialiased;padding-bottom:16px;
  -webkit-text-size-adjust:100%;
}

/* Header */
.hdr{background:var(--white);padding:52px 20px 14px;text-align:center;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
.hdr h1{font-size:19px;font-weight:800;letter-spacing:-.4px}
.hdr p{font-size:12px;color:var(--text3);margin-top:2px}

/* Tabs */
.tabs{display:flex;gap:6px;padding:10px 14px;background:var(--white);border-bottom:1px solid var(--border);overflow-x:auto;position:sticky;top:72px;z-index:49;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:7px 16px;border-radius:20px;font-size:13px;font-weight:600;color:var(--text3);background:var(--bg);border:none;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all .15s}
.tab.active{background:var(--blue);color:#fff}
.tab.today{position:relative}
.tab.today::before{content:'';position:absolute;top:4px;right:4px;width:7px;height:7px;background:var(--green);border-radius:50%;border:2px solid var(--white)}

/* Content */
.cnt{padding:10px 14px}
.dv{display:none}.dv.active{display:block}

/* Day label */
.day-lbl{font-size:11px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;padding-left:2px}

/* Exercise card */
.ex{background:var(--white);border-radius:var(--r);margin-bottom:8px;box-shadow:var(--shadow);overflow:hidden;border-left:4px solid transparent}
.ex.pri{border-left-color:var(--blue)}
.ex.addon{border-left-color:var(--purple)}
.ex-main{padding:13px 14px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ex-top{display:flex;align-items:flex-start;gap:10px}
.ex-num{display:flex;align-items:center;justify-content:center;min-width:24px;height:24px;border-radius:8px;background:var(--blue-bg);color:var(--blue);font-size:11px;font-weight:700;flex-shrink:0}
.ex.addon .ex-num{background:var(--purple-bg);color:var(--purple)}
.ex-name{font-size:15px;font-weight:700;letter-spacing:-.2px;line-height:1.3;flex:1}
.ex.addon .ex-name{font-size:14px;color:var(--purple)}
.ex-arrow{width:16px;height:16px;color:var(--text3);transition:transform .2s;flex-shrink:0;margin-top:4px}
.ex.open .ex-arrow{transform:rotate(180deg)}

/* Chips */
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:3px;padding:4px 9px;border-radius:7px;font-size:11.5px;font-weight:600;background:var(--bg)}
.chip .l{font-weight:500;color:var(--text3);font-size:10.5px}
.chip.tech{background:var(--red-bg);color:var(--red)}

/* Expandable detail */
.ex-detail{display:none;padding:0 14px 14px;border-top:1px solid var(--border)}
.ex.open .ex-detail{display:block}
.ex-notes{font-size:13px;color:var(--text2);line-height:1.55;margin-top:10px}
.ex-sub{font-size:12px;color:var(--text3);margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}

/* Log section */
.log-section{margin-top:12px;background:var(--bg);border-radius:10px;padding:10px 12px}
.log-title{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.log-prev{font-size:10px;font-weight:500;color:var(--blue);text-transform:none;letter-spacing:0}
.log-grid{display:grid;gap:6px}
.log-row{display:grid;grid-template-columns:32px 1fr 1fr auto;gap:6px;align-items:center}
.log-row .set-label{font-size:11px;font-weight:700;color:var(--text3);text-align:center}
.log-input{
  width:100%;padding:8px 10px;border-radius:8px;border:1.5px solid var(--border);
  font-size:14px;font-weight:600;font-family:inherit;color:var(--text);
  background:var(--white);text-align:center;outline:none;
  -webkit-appearance:none;appearance:none;
  transition:border-color .15s;
}
.log-input:focus{border-color:var(--blue)}
.log-input::placeholder{color:var(--text3);font-weight:400;font-size:12px}
.log-check{
  width:32px;height:32px;border-radius:8px;border:2px solid var(--border);
  background:var(--white);cursor:pointer;display:flex;align-items:center;
  justify-content:center;transition:all .15s;-webkit-tap-highlight-color:transparent;
  flex-shrink:0;
}
.log-check.done{background:var(--green);border-color:var(--green)}
.log-check.done svg{opacity:1}
.log-check svg{width:16px;height:16px;color:#fff;opacity:0;transition:opacity .15s}

/* Previous weight indicator */
.prev-val{font-size:10px;color:var(--text3);text-align:center;margin-top:2px}
.prev-val.up{color:var(--green)}
.prev-val.down{color:var(--red)}

/* Addon separator */
.addon-sep{display:flex;align-items:center;gap:8px;margin:14px 0 8px;font-size:11px;font-weight:700;color:var(--purple);text-transform:uppercase;letter-spacing:.7px}
.addon-sep::after{content:'';flex:1;height:1px;background:rgba(175,82,222,.2)}

/* Reference */
.ref{background:var(--white);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin-bottom:8px}
.ref-h{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ref-h h3{font-size:14px;font-weight:700}
.ref-arr{width:16px;height:16px;color:var(--text3);transition:transform .2s}
.ref.open .ref-arr{transform:rotate(180deg)}
.ref-b{display:none;padding:0 14px 12px}
.ref.open .ref-b{display:block}
.ref-i{font-size:12.5px;color:var(--text2);line-height:1.6;margin-bottom:6px;padding-left:10px;border-left:2px solid var(--border)}
.ref-i strong{color:var(--text)}

/* Session banner */
.session-bar{
  margin:0 14px 10px;padding:10px 14px;border-radius:10px;
  background:linear-gradient(135deg,#e8f0fe,#e8faea);
  display:flex;align-items:center;justify-content:space-between;
}
.session-bar .left{font-size:12px;font-weight:600;color:var(--text2)}
.session-bar .left span{color:var(--green);font-weight:700}
.session-bar button{
  padding:6px 14px;border-radius:8px;border:none;
  background:var(--blue);color:#fff;font-size:12px;font-weight:600;
  cursor:pointer;-webkit-tap-highlight-color:transparent;
}
.session-bar button.finish{background:var(--green)}

/* Footer */
.ftr{text-align:center;padding:20px 16px 8px;font-size:11px;color:var(--text3)}

/* Toast */
.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--text);color:#fff;padding:10px 20px;border-radius:20px;
  font-size:13px;font-weight:600;z-index:999;transition:transform .3s ease;
  box-shadow:0 4px 20px rgba(0,0,0,.15);
}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>

const SVG_CHEVRON_SM='<svg class="ref-arr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>';

// ===== STORAGE =====
function getLog(dayIdx, exIdx){
  try{return JSON.parse(localStorage.getItem(`gym_${dayIdx}_${exIdx}`))||{}}catch(e){return{}}
}
function saveLog(dayIdx, exIdx, data){
  localStorage.setItem(`gym_${dayIdx}_${exIdx}`, JSON.stringify(data));
}
function getDateKey(){return new Date().toISOString().split('T')[0]}
function getPrevSession(dayIdx, exIdx){
  const log=getLog(dayIdx,exIdx);
  const today=getDateKey();
  const dates=Object.keys(log).filter(d=>d!==today).sort().reverse();
  return dates.length?{date:dates[0],sets:log[dates[0]]}:null;
}
function getTodayLog(dayIdx, exIdx){
  const log=getLog(dayIdx,exIdx);
  return log[getDateKey()]||null;
}
function saveTodaySet(dayIdx, exIdx, setIdx, weight, reps){
  const log=getLog(dayIdx,exIdx);
  const today=getDateKey();
  if(!log[today])log[today]=[];
  while(log[today].length<=setIdx)log[today].push({w:'',r:''});
  log[today][setIdx]={w:weight,r:reps};
  saveLog(dayIdx,exIdx,log);
}
function toggleSetDone(dayIdx, exIdx, setIdx){
  const log=getLog(dayIdx,exIdx);
  const today=getDateKey();
  if(!log[today])log[today]=[];
  while(log[today].length<=setIdx)log[today].push({w:'',r:''});
  log[today][setIdx].done=!log[today][setIdx].done;
  saveLog(dayIdx,exIdx,log);
}

// ===== RENDER =====
const today=new Date().getDay();
const dayMap={2:0,3:1,5:2,6:3,0:4};

// Tabs
document.getElementById('tabs').innerHTML=DAYS.map((d,i)=>{
  const isToday=d.dow===today;
  return `<button class="tab${isToday?' today':''}" onclick="showDay(${i})" id="tab-${i}">${d.short}</button>`;
}).join('')+`<button class="tab" onclick="showDay(5)" id="tab-5">📋 Ref</button>`;

// Build content
let html='';
DAYS.forEach((day,di)=>{
  let mainN=0,addonN=0,inAddon=false;
  let exHTML='';
  day.ex.forEach((ex,ei)=>{
    if(ex.n==='__SEP__'){inAddon=true;addonN=0;exHTML+=`<div class="addon-sep">Add-ons · 30-45s rest</div>`;return}
    if(!inAddon)mainN++;else addonN++;
    const num=inAddon?`A${addonN}`:mainN;
    const cls=ex.pri?'pri':(ex.addon?'addon':'');
    const techChip=ex.tech?`<div class="chip tech">${ex.tech}</div>`:'';
    const subHTML=ex.sub&&ex.sub!=='—'?`<div class="ex-sub">↳ Sub: ${ex.sub}</div>`:'';

    // Previous session data
    const prev=getPrevSession(di,ei);
    const todayData=getTodayLog(di,ei);

    let logHTML=`<div class="log-section"><div class="log-title">LOG TODAY${prev?`<span class="log-prev">Last: ${formatDate(prev.date)}</span>`:''}</div><div class="log-grid">`;
    for(let s=0;s<ex.s;s++){
      const prevSet=prev&&prev.sets[s]?prev.sets[s]:{w:'',r:''};
      const todaySet=todayData&&todayData[s]?todayData[s]:{w:'',r:'',done:false};
      const prevW=prevSet.w?`<div class="prev-val">${prevSet.w} kg</div>`:'<div class="prev-val">—</div>';
      const prevR=prevSet.r?`<div class="prev-val">${prevSet.r} reps</div>`:'<div class="prev-val">—</div>';
      logHTML+=`<div class="log-row">
        <div class="set-label">S${s+1}</div>
        <div><input class="log-input" type="number" inputmode="decimal" placeholder="kg" value="${todaySet.w}" onchange="onLog(${di},${ei},${s},'w',this.value)">${prevW}</div>
        <div><input class="log-input" type="number" inputmode="numeric" placeholder="reps" value="${todaySet.r}" onchange="onLog(${di},${ei},${s},'r',this.value)">${prevR}</div>
        <div class="log-check${todaySet.done?' done':''}" onclick="onCheck(${di},${ei},${s},this)">${SVG_CHK}</div>
      </div>`;
    }
    logHTML+='</div></div>';

    exHTML+=`<div class="ex ${cls}" id="ex-${di}-${ei}">
      <div class="ex-main" onclick="toggleEx(this.parentElement)">
        <div class="ex-top">
          <div class="ex-num">${num}</div>
          <div class="ex-name">${ex.n}</div>
          ${SVG_CHEVRON}
        </div>
        <div class="chips">
          <div class="chip"><span class="l">Sets</span> ${ex.s}</div>
          <div class="chip"><span class="l">Reps</span> ${ex.r}</div>
          <div class="chip"><span class="l">RPE</span> ${ex.rpe}</div>
          <div class="chip"><span class="l">Rest</span> ${ex.rest}</div>
          ${techChip}
        </div>
      </div>
      <div class="ex-detail">
        <div class="ex-notes">${ex.notes}</div>
        ${subHTML}
        ${logHTML}
      </div>
    </div>`;
  });
  html+=`<div class="dv" id="dv-${di}"><div class="day-lbl">${day.label}</div>${exHTML}</div>`;
});

// Reference
let refHTML='<div class="dv" id="dv-5">';
REFS.forEach(r=>{
  refHTML+=`<div class="ref" onclick="this.classList.toggle('open')">
    <div class="ref-h"><h3>${r.t}</h3>${SVG_CHEVRON_SM}</div>
    <div class="ref-b">${r.items.map(i=>`<div class="ref-i">${i}</div>`).join('')}</div>
  </div>`;
});
refHTML+='</div>';
html+=refHTML;

document.getElementById('cnt').innerHTML=html;

// ===== FUNCTIONS =====
function showDay(i){
  document.querySelectorAll('.dv').forEach(d=>d.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('dv-'+i).classList.add('active');
  document.getElementById('tab-'+i).classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
}

function toggleEx(el){el.classList.toggle('open')}

function onLog(di,ei,si,type,val){
  const todayData=getTodayLog(di,ei)||[];
  while(todayData.length<=si)todayData.push({w:'',r:''});
  todayData[si][type]=val;
  const log=getLog(di,ei);
  log[getDateKey()]=todayData;
  saveLog(di,ei,log);
}

function onCheck(di,ei,si,el){
  el.classList.toggle('done');
  toggleSetDone(di,ei,si);
  if(el.classList.contains('done'))toast('Set '+( si+1)+' ✓');
}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1500);
}

function formatDate(d){
  const dt=new Date(d+'T00:00:00');
  const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return days[dt.getDay()]+' '+months[dt.getMonth()]+' '+dt.getDate();
}

// Auto-open today
showDay(dayMap[today]!==undefined?dayMap[today]:0);
</script>
</body>
</html>
