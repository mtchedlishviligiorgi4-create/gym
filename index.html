<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym">
<meta name="theme-color" content="#ffffff">
<title>Gym</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:#f2f2f7;--w:#fff;--t:#1c1c1e;--t2:#3a3a3c;--t3:#8e8e93;
--b:#e5e5ea;--bl:#007aff;--bl2:#e8f0fe;--gn:#34c759;--gn2:#eafcee;
--or:#ff9500;--pu:#af52de;--pu2:#f5eefa;--rd:#ff3b30;--rd2:#ffedec;
--r:14px;--sh:0 1px 3px rgba(0,0,0,.05);
}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;background:var(--bg);color:var(--t);line-height:1.48;-webkit-font-smoothing:antialiased;padding-bottom:16px;-webkit-text-size-adjust:100%}

.hd{background:var(--w);padding:50px 20px 14px;text-align:center;border-bottom:1px solid var(--b);position:sticky;top:0;z-index:50}
.hd h1{font-size:19px;font-weight:800;letter-spacing:-.4px}
.hd p{font-size:12px;color:var(--t3);margin-top:2px}

.tabs{display:flex;gap:6px;padding:10px 14px;background:var(--w);border-bottom:1px solid var(--b);overflow-x:auto;position:sticky;top:70px;z-index:49;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:7px 16px;border-radius:20px;font-size:13px;font-weight:600;color:var(--t3);background:var(--bg);border:none;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all .15s}
.tab.active{background:var(--bl);color:#fff}
.tab.today{position:relative}
.tab.today::before{content:'';position:absolute;top:3px;right:3px;width:8px;height:8px;background:var(--gn);border-radius:50%;border:2px solid var(--w);box-shadow:0 0 0 1px var(--gn)}

.cnt{padding:10px 14px}
.dv{display:none}.dv.active{display:block}
.dlb{font-size:11px;color:var(--t3);font-weight:600;text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;padding-left:2px}

/* Exercise card */
.ex{background:var(--w);border-radius:var(--r);margin-bottom:8px;box-shadow:var(--sh);overflow:hidden;border-left:4px solid transparent}
.ex.pri{border-left-color:var(--bl)}
.ex.addon{border-left-color:var(--pu)}
.ex-main{padding:12px 14px}
.ex-top{display:flex;align-items:center;gap:10px}
.ex-num{min-width:24px;height:24px;border-radius:8px;background:var(--bl2);color:var(--bl);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ex.addon .ex-num{background:var(--pu2);color:var(--pu)}
.ex-name{font-size:14.5px;font-weight:700;letter-spacing:-.2px;line-height:1.3;flex:1}
.ex.addon .ex-name{font-size:13.5px;color:var(--pu)}
.ex-arr{width:16px;height:16px;color:var(--t3);transition:transform .2s;flex-shrink:0}
.ex.open .ex-arr{transform:rotate(180deg)}

.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{padding:4px 9px;border-radius:7px;font-size:11.5px;font-weight:600;background:var(--bg);display:inline-flex;align-items:center;gap:3px}
.chip .l{font-weight:500;color:var(--t3);font-size:10.5px}
.chip.tech{background:var(--rd2);color:var(--rd)}

/* Weight logging - always visible */
.ex-wt{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--bg)}
.ex-wt-prev{font-size:11px;color:var(--t3);flex:1;line-height:1.3;-webkit-tap-highlight-color:transparent}
.ex-wt-prev strong{color:var(--t2);font-weight:700;font-size:13px}
.ex-wt-prev .date{font-size:10px;color:var(--t3)}
.wt-input-wrap{display:flex;align-items:center;gap:6px}
.wt-input{
  width:72px;padding:8px 6px;border-radius:10px;border:1.5px solid var(--b);
  font-size:15px;font-weight:700;font-family:inherit;color:var(--t);
  background:var(--w);text-align:center;outline:none;-webkit-appearance:none;
  transition:border-color .15s,box-shadow .15s;
}
.wt-input:focus{border-color:var(--bl);box-shadow:0 0 0 3px rgba(0,122,255,.12)}
.wt-input::placeholder{color:var(--t3);font-weight:400;font-size:12px}
.wt-unit{font-size:12px;color:var(--t3);font-weight:600}
.wt-save{
  width:36px;height:36px;border-radius:10px;border:none;
  background:var(--bl);color:#fff;cursor:pointer;display:flex;
  align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent;transition:all .15s;
  flex-shrink:0;
}
.wt-save:active{transform:scale(.92)}
.wt-save.saved{background:var(--gn);animation:pop .3s ease}
.wt-save svg{width:18px;height:18px}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* Progress indicator */
.wt-trend{font-size:10px;font-weight:700;margin-left:4px}
.wt-trend.up{color:var(--gn)}
.wt-trend.down{color:var(--rd)}
.wt-trend.same{color:var(--t3)}

/* Detail */
.ex-det{display:none;padding:0 14px 10px}
.ex.open .ex-det{display:block;animation:fadeUp .2s ease}
.ex-notes{font-size:12.5px;color:var(--t2);line-height:1.5;margin-top:8px}
.ex-sub{font-size:12px;color:var(--t3);margin-top:8px;padding-top:8px;border-top:1px solid var(--b)}

/* History */
.ex-hist{margin-top:10px;padding:8px 10px;background:var(--bg);border-radius:10px}
.ex-hist-title{font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.hist-row{display:flex;justify-content:space-between;padding:4px 0;font-size:12px;border-bottom:1px solid rgba(0,0,0,.04)}
.hist-row:last-child{border-bottom:none}
.hist-date{color:var(--t3);font-weight:500}
.hist-val{font-weight:700;color:var(--t)}

.addon-sep{display:flex;align-items:center;gap:8px;margin:14px 0 8px;font-size:11px;font-weight:700;color:var(--pu);text-transform:uppercase;letter-spacing:.7px}
.addon-sep::after{content:'';flex:1;height:1px;background:rgba(175,82,222,.2)}

/* Ref */
.ref{background:var(--w);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;margin-bottom:8px}
.ref-h{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ref-h h3{font-size:14px;font-weight:700}
.ref-a{width:16px;height:16px;color:var(--t3);transition:transform .2s}
.ref.open .ref-a{transform:rotate(180deg)}
.ref-b{display:none;padding:0 14px 12px}
.ref.open .ref-b{display:block}
.ref-i{font-size:12.5px;color:var(--t2);line-height:1.6;margin-bottom:6px;padding-left:10px;border-left:2px solid var(--b)}
.ref-i strong{color:var(--t)}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--t);color:#fff;padding:10px 24px;border-radius:22px;font-size:13px;font-weight:600;z-index:999;transition:transform .3s cubic-bezier(.34,1.56,.64,1);box-shadow:0 4px 20px rgba(0,0,0,.18)}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>

// Storage
const dk=()=>new Date().toISOString().split('T')[0];
function getW(di,ei){try{return JSON.parse(localStorage.getItem(`g_${di}_${ei}`))||[]}catch(e){return[]}}
function saveW(di,ei,arr){localStorage.setItem(`g_${di}_${ei}`,JSON.stringify(arr))}
function lastW(di,ei){const a=getW(di,ei);const today=dk();for(let i=a.length-1;i>=0;i--)if(a[i].d!==today)return a[i];return null}
function todayW(di,ei){const a=getW(di,ei);const today=dk();for(let i=a.length-1;i>=0;i--)if(a[i].d===today)return a[i];return null}
function logW(di,ei,val){
  const a=getW(di,ei);const today=dk();
  const idx=a.findIndex(x=>x.d===today);
  if(idx>=0)a[idx].w=val;else a.push({d:today,w:val});
  saveW(di,ei,a);
}
function fmtD(d){const dt=new Date(d+'T12:00:00');const ds=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];const ms=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return ds[dt.getDay()]+', '+ms[dt.getMonth()]+' '+dt.getDate()}

let html='';
D.forEach((day,di)=>{
  let mn=0,an=0,ia=false,exHtml='';
  day.ex.forEach((e,ei)=>{
    if(e.n==='__S__'){ia=true;an=0;exHtml+=`<div class="addon-sep">Add-ons · 30-45s rest</div>`;return}
    if(!ia)mn++;else an++;
    const num=ia?`A${an}`:mn;
    const cls=e.p?'pri':(e.a?'addon':'');
    const tc=e.tech?`<div class="chip tech">${e.tech}</div>`:'';
    const sub=e.su&&e.su!=='—'?`<div class="ex-sub">↳ Sub: ${e.su}</div>`:'';
    
    // Weight display
    const prev=lastW(di,ei);
    const tod=todayW(di,ei);
    let prevHtml='<span style="color:var(--t3);font-size:11px">No previous data</span>';
    if(prev){
      let trend='';
      if(tod&&tod.w&&prev.w){
        const diff=parseFloat(tod.w)-parseFloat(prev.w);
        if(diff>0)trend=`<span class="wt-trend up">↑ +${diff}</span>`;
        else if(diff<0)trend=`<span class="wt-trend down">↓ ${diff}</span>`;
        else trend=`<span class="wt-trend same">= same</span>`;
      }
      prevHtml=`<strong>${prev.w} kg</strong>${trend}<br><span class="date">${fmtD(prev.d)}</span> · <span style="color:var(--bl);font-size:10px">history ▾</span>`;
    }

    // History for detail view
    const hist=getW(di,ei).slice(-5).reverse();
    let histHtml='';
    if(hist.length>0){
      histHtml=`<div class="ex-hist"><div class="ex-hist-title">Recent History</div>${hist.map(h=>`<div class="hist-row"><span class="hist-date">${fmtD(h.d)}</span><span class="hist-val">${h.w} kg</span></div>`).join('')}</div>`;
    }

    exHtml+=`<div class="ex ${cls}" id="e${di}_${ei}">
      <div class="ex-main">
        <div class="ex-top">
          <div class="ex-num">${num}</div>
          <div class="ex-name">${e.n}</div>
                  </div>
        <div class="chips">
          <div class="chip"><span class="l">Sets</span> ${e.s}</div>
          <div class="chip"><span class="l">Reps</span> ${e.r}</div>
          <div class="chip"><span class="l">RPE</span> ${e.rpe}</div>
          <div class="chip"><span class="l">Rest</span> ${e.rest}</div>
          ${tc}
        </div>
        <div class="ex-notes">${e.nt}</div>
        ${sub}
        <div class="ex-wt" onclick="event.stopPropagation()">
          <div class="ex-wt-prev" id="pv${di}_${ei}" onclick="th(${di},${ei})" style="cursor:pointer">${prevHtml}</div>
          <div class="wt-input-wrap">
            <input class="wt-input" id="wi${di}_${ei}" type="number" inputmode="decimal" placeholder="kg" value="${tod?tod.w:''}" onfocus="event.stopPropagation()">
            <button class="wt-save${tod?' saved':''}" id="ws${di}_${ei}" onclick="event.stopPropagation();sv(${di},${ei})">${SAVE_ICON}</button>
          </div>
        </div>
      </div>
      <div class="ex-det" id="det${di}_${ei}">
        ${histHtml}
      </div>
    </div>`;
  });
  html+=`<div class="dv" id="d${di}"><div class="dlb">${day.lb}</div>${exHtml}</div>`;
});

// Ref
let rh='<div class="dv" id="d5">';
REFS.forEach(r=>{rh+=`<div class="ref" onclick="this.classList.toggle('open')"><div class="ref-h"><h3>${r.t}</h3>${CHV2}</div><div class="ref-b">${r.i.map(x=>`<div class="ref-i">${x}</div>`).join('')}</div></div>`;});
rh+='</div>';
html+=rh;

document.getElementById('cnt').innerHTML=html;

function sd(i){document.querySelectorAll('.dv').forEach(d=>d.classList.remove('active'));document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.getElementById('d'+i).classList.add('active');document.getElementById('t'+i).classList.add('active');window.scrollTo({top:0,behavior:'smooth'})}
function te(el){el.classList.toggle('open')}
function th(di,ei){document.getElementById('det'+di+'_'+ei).style.display=document.getElementById('det'+di+'_'+ei).style.display==='block'?'none':'block'}
function sv(di,ei){
  const inp=document.getElementById(`wi${di}_${ei}`);
  const val=inp.value.trim();
  if(!val)return;
  logW(di,ei,val);
  const btn=document.getElementById(`ws${di}_${ei}`);
  btn.classList.add('saved');
  // Update prev display
  const prev=lastW(di,ei);
  const pv=document.getElementById(`pv${di}_${ei}`);
  if(prev){
    let trend='';
    const diff=parseFloat(val)-parseFloat(prev.w);
    if(diff>0)trend=`<span class="wt-trend up">↑ +${diff}</span>`;
    else if(diff<0)trend=`<span class="wt-trend down">↓ ${diff}</span>`;
    else trend=`<span class="wt-trend same">= same</span>`;
    pv.innerHTML=`<strong>${prev.w} kg</strong>${trend}<br><span class="date">${fmtD(prev.d)}</span>`;
  }
  toast('✓ Saved');
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1400)}

sd(dm[today]!==undefined?dm[today]:0);
</script>
</body>
</html>
