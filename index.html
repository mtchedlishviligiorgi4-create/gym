<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym">
<meta name="theme-color" content="#f2f2f7">
<title>Gym</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f2f2f7;--w:#fff;--w2:#fafafd;
  --t:#1c1c1e;--t2:#3a3a3c;--t3:#8e8e93;--t4:#c7c7cc;
  --b:#e5e5ea;--b2:#f0f0f4;
  --bl:#007aff;--bl2:#e8f0fe;
  --gn:#34c759;--gn2:#e7f9ec;
  --or:#ff9500;--or2:#fff3e0;
  --pu:#af52de;--pu2:#f5eefa;
  --rd:#ff3b30;--rd2:#ffedec;
  --r:14px;--sh:0 1px 2px rgba(0,0,0,.05);
  --restbg:#1c1c1e;--restfg:#fff;
  --safe-b:env(safe-area-inset-bottom,0px);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#000;--w:#1c1c1e;--w2:#232325;
  --t:#fff;--t2:#e5e5ea;--t3:#8e8e93;--t4:#48484a;
  --b:#38383a;--b2:#2c2c2e;
  --bl:#0a84ff;--bl2:#0d2947;
  --gn:#30d158;--gn2:#0f2e18;
  --or:#ff9f0a;--or2:#332200;
  --pu:#bf5af2;--pu2:#2a1533;
  --rd:#ff453a;--rd2:#3a1512;
  --restbg:#f2f2f7;--restfg:#000;
}}
body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;
  background:var(--bg);color:var(--t);line-height:1.45;-webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;padding-bottom:calc(96px + var(--safe-b));
}

/* ── header ─────────────────────────────────────────── */
.hd{background:var(--w);padding:calc(14px + env(safe-area-inset-top,0px)) 16px 0;border-bottom:1px solid var(--b);position:sticky;top:0;z-index:60}
.hd-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.hd-t{font-size:17px;font-weight:800;letter-spacing:-.4px}
.hd-t span{font-weight:500;color:var(--t3);font-size:12px;letter-spacing:0;margin-left:6px}
.hd-meta{display:flex;gap:6px;align-items:center}
.pill{font-size:11px;font-weight:700;padding:4px 9px;border-radius:20px;background:var(--bg);color:var(--t2);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.live{background:var(--gn2);color:var(--gn)}
.pill.over{background:var(--or2);color:var(--or)}
.pill button{all:unset;cursor:pointer}

/* session progress bar */
.prog{height:3px;background:var(--b2);border-radius:2px;overflow:hidden;margin-bottom:10px}
.prog i{display:block;height:100%;background:var(--gn);width:0;transition:width .35s ease}

.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:7px 15px;border-radius:20px;font-size:13px;font-weight:600;color:var(--t3);background:var(--bg);border:none;cursor:pointer;-webkit-tap-highlight-color:transparent;position:relative}
.tab.active{background:var(--bl);color:#fff}
.tab.today::after{content:'';position:absolute;top:4px;right:5px;width:6px;height:6px;background:var(--gn);border-radius:50%;box-shadow:0 0 0 1.5px var(--w)}
.tab.active.today::after{box-shadow:0 0 0 1.5px var(--bl)}

.cnt{padding:12px 12px 0}
.dv{display:none}.dv.active{display:block}
.dlb{font-size:11px;color:var(--t3);font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin:2px 0 10px 4px}

/* ── slot (superset bracket or single) ──────────────── */
.slot{margin-bottom:10px;border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);background:var(--w)}
.slot.ss,.slot.myo{border:1.5px solid var(--pu2)}
.srow.mini .fld input{background:var(--pu2)}
.srow.mini .sn{color:var(--pu);font-size:14px}
.swap{margin-top:9px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.swap-l{font-size:10px;font-weight:800;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;width:100%;margin-bottom:1px}
.sw{font-size:11.5px;font-weight:600;font-family:inherit;padding:6px 10px;border-radius:8px;border:1px solid var(--b);
 background:var(--w);color:var(--t2);cursor:pointer;-webkit-tap-highlight-color:transparent}
.sw.on{background:var(--bl);border-color:var(--bl);color:#fff}
.ss-hd{display:flex;align-items:center;gap:7px;padding:7px 12px;background:var(--pu2);font-size:10.5px;font-weight:800;color:var(--pu);text-transform:uppercase;letter-spacing:.7px}
.ss-hd .rt{margin-left:auto;font-weight:600;letter-spacing:0;text-transform:none;font-size:11px;opacity:.85}

.ex{border-bottom:1px solid var(--b2)}
.ex:last-child{border-bottom:none}
.ex-hd{display:flex;align-items:flex-start;gap:9px;padding:11px 12px 8px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ex-badge{min-width:22px;height:22px;border-radius:7px;background:var(--bl2);color:var(--bl);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.slot.ss .ex-badge{background:var(--pu2);color:var(--pu)}
.ex-badge.done{background:var(--gn2);color:var(--gn)}
.ex-main{flex:1;min-width:0}
.ex-n{font-size:14.5px;font-weight:700;letter-spacing:-.2px;line-height:1.28}
.ex-sub{font-size:11.5px;color:var(--t3);margin-top:2px;font-variant-numeric:tabular-nums}
.ex-sub b{color:var(--t2);font-weight:700}
.ex-sub .tgt{color:var(--t3)}
.ex-prev{font-size:11.5px;font-weight:700;color:var(--t3);text-align:right;white-space:nowrap;margin-top:2px;font-variant-numeric:tabular-nums}
.ex-prev.up{color:var(--gn)}

/* set rows */
.sets{padding:0 12px 10px}
.srow{display:grid;grid-template-columns:20px 1fr 1fr 38px;gap:7px;align-items:center;margin-bottom:6px}
.srow:last-child{margin-bottom:0}
.sn{font-size:11px;font-weight:700;color:var(--t3);text-align:center;font-variant-numeric:tabular-nums}
.fld{position:relative}
.fld input{
  width:100%;padding:9px 8px 9px 9px;border-radius:9px;border:1.5px solid var(--b);
  font-size:15px;font-weight:700;font-family:inherit;color:var(--t);background:var(--w2);
  text-align:center;outline:none;-webkit-appearance:none;font-variant-numeric:tabular-nums;
  transition:border-color .12s,background .12s;
}
.fld input:focus{border-color:var(--bl);background:var(--w)}
.fld input::placeholder{color:var(--t4);font-weight:500;font-size:13px}
.fld .u{position:absolute;right:7px;top:50%;transform:translateY(-50%);font-size:10px;font-weight:700;color:var(--t4);pointer-events:none}
.srow.done .fld input{background:var(--gn2);border-color:var(--gn)}
.tick{
  width:38px;height:36px;border-radius:9px;border:1.5px solid var(--b);background:var(--w2);
  cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;
  color:var(--t4);transition:all .12s;padding:0;
}
.tick svg{width:17px;height:17px}
.tick:active{transform:scale(.9)}
.srow.done .tick{background:var(--gn);border-color:var(--gn);color:#fff}
.shdr{display:grid;grid-template-columns:20px 1fr 1fr 38px;gap:7px;margin-bottom:5px;font-size:9.5px;font-weight:700;color:var(--t4);text-transform:uppercase;letter-spacing:.5px;text-align:center}

/* detail */
.det{display:none;padding:0 12px 11px}
.ex.open .det{display:block}
.nt{font-size:12.5px;color:var(--t2);line-height:1.5;background:var(--bg);padding:9px 11px;border-radius:10px}
.nt .sub{display:block;margin-top:6px;padding-top:6px;border-top:1px solid var(--b);color:var(--t3);font-size:12px}
.hist{margin-top:8px}
.hist-t{font-size:9.5px;font-weight:800;color:var(--t4);text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px}
.hrow{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:12px;border-bottom:1px solid var(--b2)}
.hrow:last-child{border-bottom:none}
.hd8{color:var(--t3);flex-shrink:0}
.hv{font-weight:700;text-align:right;font-variant-numeric:tabular-nums;color:var(--t2)}

/* ── rest timer ─────────────────────────────────────── */
.rest{
  position:fixed;left:10px;right:10px;bottom:calc(10px + var(--safe-b));z-index:200;
  background:var(--restbg);color:var(--restfg);border-radius:16px;padding:11px 14px;
  display:flex;align-items:center;gap:12px;box-shadow:0 6px 24px rgba(0,0,0,.24);
  transform:translateY(140%);transition:transform .28s cubic-bezier(.34,1.3,.64,1);
}
.rest.show{transform:translateY(0)}
.rest.ready{background:var(--gn);color:#062b12}
.rest-n{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.8px;min-width:62px}
.rest-i{flex:1;min-width:0;font-size:11.5px;line-height:1.3;opacity:.85;overflow:hidden}
.rest-i span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rest-i b{display:block;font-size:13px;font-weight:700;opacity:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rest-x{all:unset;cursor:pointer;font-size:12px;font-weight:700;padding:7px 11px;border-radius:9px;background:rgba(128,128,128,.3);-webkit-tap-highlight-color:transparent}
.rest-bar{position:absolute;left:0;bottom:0;height:3px;background:currentColor;opacity:.4;border-radius:0 0 16px 16px;transition:width 1s linear}

/* ── summary sheet ──────────────────────────────────── */
.sheet{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.45);display:none;align-items:flex-end}
.sheet.show{display:flex}
.sheet-in{background:var(--w);width:100%;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + var(--safe-b));max-height:88vh;overflow-y:auto}
.sheet h3{font-size:19px;font-weight:800;letter-spacing:-.4px;margin-bottom:3px}
.sheet .sub{font-size:13px;color:var(--t3);margin-bottom:16px}
.stat-g{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.stat{background:var(--bg);border-radius:12px;padding:11px 12px}
.stat .k{font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.5px}
.stat .v{font-size:21px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums;margin-top:2px}
.stat .n{font-size:11.5px;color:var(--t3);line-height:1.35;margin-top:1px}
.verdict{font-size:13.5px;line-height:1.5;color:var(--t2);background:var(--bl2);border-radius:12px;padding:11px 13px;margin-bottom:14px}
.verdict b{color:var(--t)}
.verdict.warn{background:var(--or2)}
.btn{display:block;width:100%;padding:13px;border-radius:13px;border:none;background:var(--bl);color:#fff;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn.sec{background:var(--w);color:var(--t2);border:1px solid var(--b);margin-top:8px;font-size:14.5px}

/* ── stats ──────────────────────────────────────────── */
.card{background:var(--w);border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin-bottom:9px}
.card h4{font-size:13px;font-weight:800;letter-spacing:-.1px;margin-bottom:2px}
.card .cap{font-size:11.5px;color:var(--t3);line-height:1.4;margin-bottom:12px}
.vr{display:grid;grid-template-columns:74px 1fr 52px;gap:8px;align-items:center;padding:2.5px 0}
.vr .vm{font-size:12px;color:var(--t2)}
.vtr{position:relative;height:14px;background:var(--b2);border-radius:3px;overflow:hidden}
.vtr .band{position:absolute;left:40%;width:26.7%;top:0;bottom:0;background:var(--gn2)}
.vtr .fill{position:absolute;left:0;top:0;bottom:0;background:var(--bl);border-radius:3px}
.vtr .fill.low{background:var(--or)}.vtr .fill.high{background:var(--pu)}
.vtr .plan{position:absolute;top:-1px;bottom:-1px;width:2px;background:var(--t2);opacity:.55}
.vn{font-size:11px;font-weight:700;color:var(--t2);text-align:right;font-variant-numeric:tabular-nums}
.vn.low{color:var(--or)}.vn.high{color:var(--pu)}
.wk{display:flex;gap:5px}
.wk div{flex:1;text-align:center;padding:8px 2px;border-radius:9px;background:var(--bg)}
.wk .n{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.wk .l{font-size:9.5px;color:var(--t3);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-top:2px}
.wk div.good .n{color:var(--gn)}.wk div.miss .n{color:var(--or)}
.bwrow{display:flex;gap:7px;align-items:center;margin-bottom:10px}
.bwrow input{flex:1;padding:9px;border-radius:9px;border:1.5px solid var(--b);background:var(--w2);
 font:700 15px inherit;font-family:inherit;color:var(--t);text-align:center;outline:none;-webkit-appearance:none}
.bwrow input:focus{border-color:var(--bl)}
.bwrow button{padding:10px 15px;border-radius:9px;border:none;background:var(--bl);color:#fff;font:700 13px/1 inherit;font-family:inherit;cursor:pointer}
.big{font-size:23px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.note{font-size:12px;line-height:1.45;color:var(--t2);background:var(--bg);border-radius:10px;padding:9px 11px;margin-top:9px}
.note.ok{background:var(--gn2)}.note.warn{background:var(--or2)}
.stall{font-size:12.5px;color:var(--t2);padding:5px 0;border-bottom:1px solid var(--b2)}
.stall:last-child{border-bottom:none}
.stall b{color:var(--or)}

/* ── reference ──────────────────────────────────────── */
.ref{background:var(--w);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;margin-bottom:9px}
.ref-h{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ref-h h3{font-size:14px;font-weight:700}
.chev{width:15px;height:15px;color:var(--t4);transition:transform .2s;flex-shrink:0}
.ref.open .chev,.ex.open .chev{transform:rotate(180deg)}
.ref-b{display:none;padding:0 14px 12px}
.ref.open .ref-b{display:block}
.ref-i{font-size:12.5px;color:var(--t2);line-height:1.55;margin-bottom:7px;padding-left:10px;border-left:2px solid var(--b)}
.ref-i strong{color:var(--t)}

.toast{position:fixed;bottom:calc(96px + var(--safe-b));left:50%;transform:translateX(-50%) translateY(70px);background:var(--t);color:var(--w);padding:9px 20px;border-radius:20px;font-size:13px;font-weight:600;z-index:400;transition:transform .28s cubic-bezier(.34,1.4,.64,1),opacity .2s;box-shadow:0 4px 18px rgba(0,0,0,.2);white-space:nowrap;opacity:0;pointer-events:none}
@media(prefers-color-scheme:dark){.toast{background:#f2f2f7;color:#000}}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="hd">
  <div class="hd-top">
    <div class="hd-t">HYPERTROPHY <span id="wk">Week 1</span></div>
    <div class="hd-meta">
      <div class="pill" id="clock">–</div>
      <div class="pill" id="count">0/0</div>
    </div>
  </div>
  <div class="prog"><i id="progbar"></i></div>
  <div class="tabs" id="tabs"></div>
</div>

<div class="cnt" id="cnt"></div>

<div class="rest" id="rest">
  <div class="rest-n" id="restN">0:00</div>
  <div class="rest-i"><b id="restEx">—</b><span id="restNext">next up</span></div>
  <button class="rest-x" onclick="skipRest()">SKIP</button>
  <div class="rest-bar" id="restBar"></div>
</div>

<div class="sheet" id="sheet"><div class="sheet-in" id="sheetIn"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ═══════════════════════════════════════════════════════
   PROGRAM v6 — machines / cables / dumbbells only
   Slots hold either one exercise or an alternating superset.
   Every exercise has a STABLE id: history survives reordering.
   ═══════════════════════════════════════════════════════ */
const CHEV='<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>';
const TICK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12l5 5L20 7"/></svg>';

const PROG=[
{sh:"Tue",dw:2,lb:"Heavy upper + quads",slots:[
 {rest:120,ex:[{id:"machine-incline-press",n:"Machine Incline Press",s:4,r:"8–12",tg:"chest · upper",
  nt:"One of your three press angles. Retract the shoulder blades, controlled 2–3 s negative, deep stretch at the bottom.",
  su:["Incline DB Press (30°)","Pec Deck, high setting"]}]},
 {rest:120,ex:[{id:"t-bar-row",n:"T-Bar Row (machine)",s:4,r:"8–12",tg:"back · thickness",
  nt:"Chest on the pad so the lower back stays out of it. Elbows ~45°, squeeze 1 s, full stretch at the bottom.",
  su:["Chest-Supported Row (wide)","Machine Row"]}]},
 {rest:90,ex:[{id:"leg-extension",n:"Leg Extension",s:4,r:"8–12",tg:"quads · heaviest",
  nt:"Your progressive quad lift — chase weight here. Seat back, slow 2 s negative.",
  su:["Leg Press (moderate feet)","Single-Leg Extension"]}]},
 {myo:1,rest:15,ex:[{id:"lateral-raise-machine",n:"Lateral Raise Machine",s:4,r:"12–15",tg:"side delts",myo:1,
  nt:"MYO-REPS. One hard set of 12–15, then 15 s rest and 5 more reps, three times. Never leave the machine — this is why it is here.",
  su:["BTB Cable Lateral Raise","DB Lateral Raise"]}]},
 {rest:75,ex:[{id:"biceps-machine",n:"Biceps Machine",s:3,r:"10–15",tg:"biceps",
  nt:"Pad under the upper arms, elbows pinned. Full stretch at the bottom, squeeze at the top.",
  su:["Incline DB Curl","Bayesian Cable Curl"]}]},
 {myo:1,rest:15,ex:[{id:"standing-calf",n:"Standing Calf Raise",s:4,r:"12–15",tg:"calves · toes straight",myo:1,
  nt:"MYO-REPS. Knees FULLY LOCKED, 2–3 s deep stretch at the bottom. Standing beats seated for the gastrocnemius and matches it for soleus.",
  su:["Leg Press Calf Raise","Smith Calf Raise"]}]},
 {rest:60,ex:[{id:"crunch",n:"Weighted Crunch",s:3,r:"10–15",tg:"abs · upper",
  nt:"Plate on the chest. Round the lower back, 2 s eccentric. Crunches out-activate leg raises by ~36% and bias the upper abs — Friday's leg raise covers the lower half.",
  su:["Machine Crunch","Decline Crunch"]}]},
 {rest:60,ex:[{id:"neck-curl",n:"Plate Neck Curl (face up)",s:3,r:"10–15",tg:"neck",
  nt:"Towel and a plate — no machine to queue for, which is why it survived the rebuild. Week 1: 2 sets at 5 lb only.",
  su:["Harness Neck Curl","Skip if pushed for time"]}]},
]},
{sh:"Wed",dw:3,lb:"Chest mid + lat width + hams",slots:[
 {rest:120,ex:[{id:"machine-chest-press",n:"Machine Chest Press — flat",s:4,r:"8–12",tg:"chest · mid",
  nt:"The flat angle. This is the sternocostal work the old programme had almost none of.",
  su:["Flat DB Press","Pec Deck"]}]},
 {rest:120,ex:[{id:"lat-pulldown-wide",n:"Lat Pulldown — wide, overhand",s:4,r:"10–13",tg:"lats · width",
  nt:"Wide overhand. Pull to the upper chest, full stretch at the top. This is the width movement — nothing else in the week trains the lats abducted.",
  su:["Machine Pulldown (wide)","Assisted Pull-Up"]}]},
 {rest:90,ex:[{id:"seated-leg-curl",n:"Seated Leg Curl",s:4,r:"10–15",tg:"hamstrings",
  nt:"Seated, not lying — about 50% more growth. Lean forward slightly, 2 s eccentric.",
  su:["Single-Leg Seated Curl","Lying Leg Curl"]}]},
 {myo:1,rest:15,ex:[{id:"reverse-pec-deck",n:"Reverse Pec Deck",s:4,r:"12–15",tg:"rear delts",myo:1,
  nt:"MYO-REPS. Light, 1–2 s squeeze at the peak. One machine, one weight, no walking.",
  su:["Cable Face Pull","Machine Reverse Fly"]}]},
 {rest:75,ex:[{id:"cable-pushdown",n:"Cable Pushdown (rope)",s:3,r:"10–15",tg:"triceps · lateral",
  nt:"Spread the rope at the bottom. Elbows pinned to the ribs.",
  su:["Machine Triceps Extension","Bar Pushdown"]}]},
 {rest:60,ex:[{id:"hip-abd-add",n:"Hip Abd ⇄ Hip Add",s:3,r:"15–25",tg:"glute med · adductors",
  nt:"The one true pair in the programme — same machine, you just flip the pads between sets. Lean forward 30–45°.",
  su:["Cable Abduction","Banded Lateral Walk"]}]},
 {rest:75,ex:[{id:"db-lateral",n:"DB Lateral Raise",s:4,r:"12–15",tg:"side delts",
  nt:"Dumbbells, so it works even when every machine is taken. Neutral grip, above parallel, 2–3 s eccentric.",
  su:["Lateral Raise Machine","Cable Lateral Raise"]}]},
]},
{sh:"Fri",dw:5,lb:"Heaviest",slots:[
 {rest:120,ex:[{id:"machine-decline-press",n:"Machine Decline Press",s:4,r:"6–10",tg:"chest · lower",
  nt:"Your third press angle and the heaviest press of the week. Decline loads the lower sternal fibres nothing else here reaches.",

/* ═══════════ storage ═══════════ */
const K='gymv2:', KB='gymv2:blockStart', KS='gymv2:sessions';
const dk=d=>(d||new Date()).toISOString().slice(0,10);
const J=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))??f}catch(e){return f}};
const W=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast('Storage full')}};

const getEx=id=>J(K+id,[]);
function logSet(id,i,w,r){
  const a=getEx(id), d=dk();
  let e=a.find(x=>x.d===d);
  if(!e){e={d,sets:[],ts:[]};a.push(e)}
  e.sets[i]={w:+w||0,r:+r||0};
  e.ts[i]=Date.now();
  W(K+id,a);
}
function unlogSet(id,i){
  const a=getEx(id), d=dk(), e=a.find(x=>x.d===d);
  if(!e)return;
  delete e.sets[i]; delete e.ts[i];
  if(!e.sets.filter(Boolean).length){a.splice(a.indexOf(e),1)}
  W(K+id,a);
}
const today=d=>getEx(d).find(x=>x.d===dk());
function prev(id){const a=getEx(id),d=dk();for(let i=a.length-1;i>=0;i--)if(a[i].d!==d&&a[i].sets.filter(Boolean).length)return a[i];return null}
const n1=v=>Math.round(v*10)/10;
function fmtSets(e){
  const s=e.sets.filter(Boolean);
  if(!s.length)return '—';
  const w=[...new Set(s.map(x=>x.w))], r=s.map(x=>x.r);
  return (w.length===1?n1(w[0]):n1(Math.min(...w))+'–'+n1(Math.max(...w)))+' kg × '+r.join('/');
}
function fmtD(d){const t=new Date(d+'T12:00:00');
  return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][t.getDay()]+' '+t.getDate()+' '+
  ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][t.getMonth()]}
/* earned the increment? every set at or above the top of the range */
function earned(ex){
  const e=today(ex.id)||prev(ex.id); if(!e)return false;
  const s=e.sets.filter(Boolean);
  if(s.length<ex.s)return false;
  const top=+ex.r.split(/[–-]/)[1];
  return s.every(x=>x.r>=top);
}

/* ═══════════ volume model ═══════════
   Compound lifts give half credit to secondary movers — the same
   accounting used to set the targets, so plan and actual are comparable.
   Band = 12–20 weekly sets per muscle (Baz-Valle 2022 systematic review). */
const MUS={
 "machine-incline-press":{Chest:1,Triceps:.5},"machine-chest-press":{Chest:1,Triceps:.5},
 "machine-decline-press":{Chest:1,Triceps:.5},"pec-deck":{Chest:1},
 "t-bar-row":{Back:1,"Rear delt":.5,Biceps:.5},"chest-supported-row":{Back:1,"Rear delt":.5,Biceps:.5},
 "seated-cable-row":{Back:1,"Rear delt":.5,Biceps:.5},
 "lat-pulldown-wide":{Back:1,Biceps:.5},"neutral-machine-pd":{Back:1,Biceps:.5},
 "lateral-raise-machine":{"Side delt":1},"db-lateral":{"Side delt":1},
 "reverse-pec-deck":{"Rear delt":1},"face-pull":{"Rear delt":1},
 "cable-pushdown":{Triceps:1},"oh-cable-triceps":{Triceps:1},
 "biceps-machine":{Biceps:1},"incline-db-curl":{Biceps:1},
 "leg-extension":{Quads:1},"leg-press":{Quads:1},"seated-leg-curl":{Hamstrings:1},
 "standing-calf":{Calves:1},"hip-abd-add":{"Glute med":1},
 "crunch":{Abs:1},"hanging-leg-raise":{Abs:1},
 "back-extension":{Erectors:1,Hamstrings:.5},
 "neck-curl":{Neck:1},"neck-ext":{Neck:1}};
const KBW='gymv2:bw', SCALE=30;
const KV='gymv2:var:';
const varOf=(di,si)=>J(KV+di+':'+si,0);
const setVar=(di,si,v)=>W(KV+di+':'+si,v);
const baseId=id=>id.split('@')[0];
function variantName(x,v){return v===0?x.n:(x.su&&x.su[v-1])||x.n}
function variantId(x,v){return v===0?x.id:x.id+'@'+v}   // bar scale: 0-30 sets, band 12-20
const allIds=()=>{const s=new Set();PROG.forEach((d,di)=>d.slots.forEach((sl,si)=>sl.ex.forEach(x=>{
  s.add(x.id); (x.su||[]).forEach((_,i)=>s.add(x.id+'@'+(i+1)))})));return [...s]};
const exName=id=>{const b=baseId(id),v=+(id.split('@')[1]||0);
  for(const d of PROG)for(const sl of d.slots)for(const x of sl.ex)if(x.id===b)return variantName(x,v);return id};
function plannedVol(){const t={};
  PROG.forEach(d=>d.slots.forEach(sl=>sl.ex.forEach(x=>{
    for(const m in MUS[x.id]||{})t[m]=(t[m]||0)+x.s*MUS[x.id][m]})));return t}
function actualVol(n){const cut=new Date(Date.now()-n*864e5).toISOString().slice(0,10),t={};
  allIds().forEach(id=>getEx(id).forEach(e=>{if(e.d>cut){
    const c=e.sets.filter(Boolean).length;
    const b=baseId(id);
    for(const m in MUS[b]||{})t[m]=(t[m]||0)+c*MUS[b][m]}}));return t}
function trainedDays(){const s=new Set();
  allIds().forEach(id=>getEx(id).forEach(e=>{if(e.sets.filter(Boolean).length)s.add(e.d)}));
  return [...s].sort()}
function weekCounts(n){const out=[],days=trainedDays();
  for(let w=n-1;w>=0;w--){
    const hi=new Date(Date.now()-w*7*864e5), lo=new Date(hi-7*864e5);
    out.push(days.filter(d=>{const t=new Date(d+'T12:00:00');return t>lo&&t<=hi}).length)}
  return out}
function logBW(w){const a=J(KBW,[]),d=dk(),i=a.findIndex(x=>x.d===d);
  if(i>=0)a[i].w=+w;else a.push({d,w:+w});a.sort((x,y)=>x.d<y.d?-1:1);W(KBW,a)}
function bwTrend(){const a=J(KBW,[]);if(!a.length)return null;
  const now=Date.now(),age=x=>(now-new Date(x.d+'T12:00:00'))/864e5;
  const R=a.filter(x=>age(x)<7), O=a.filter(x=>age(x)>=14&&age(x)<28);
  const avg=r=>r.reduce((s,x)=>s+x.w,0)/r.length;
  const latest=a[a.length-1];
  if(!R.length||!O.length)return {latest,n:a.length};
  return {latest,n:a.length,cur:avg(R),rate:(avg(R)-avg(O))/17.5*SCALE}}
function stalls(){const out=[];
  allIds().forEach(id=>{const a=getEx(id).filter(e=>e.sets.filter(Boolean).length).slice(-3);
    if(a.length<3)return;
    const best=e=>Math.max(...e.sets.filter(Boolean).map(s=>s.w*s.r));
    if(best(a[2])<=best(a[0]))out.push(id)});
  return out}

/* ═══════════ session state ═══════════ */
let day=0, timer=null, restEnd=0, sessStart=null, tick=null;

function blockWeek(){
  let b=J(KB,null);
  if(!b){b=dk();W(KB,b)}
  const w=Math.floor((new Date(dk())-new Date(b))/864e5/7)+1;
  return ((w-1)%5)+1;
}
function sessionSets(){
  let done=0,total=0,stamps=[];
  if(!PROG[day])return {done,total,stamps};
  PROG[day].slots.forEach((sl,si)=>sl.ex.forEach(x=>{
    total+=x.s;
    const e=today(variantId(x,varOf(day,si)));
    if(e){done+=e.sets.filter(Boolean).length; e.ts.forEach(t=>t&&stamps.push(t))}
  }));
  return {done,total,stamps:stamps.sort((a,b)=>a-b)};
}
function paint(){
  const {done,total,stamps}=sessionSets();
  document.getElementById('count').textContent=done+'/'+total;
  document.getElementById('progbar').style.width=(total?done/total*100:0)+'%';
  const c=document.getElementById('clock');
  if(stamps.length){
    if(!sessStart)sessStart=stamps[0];
    const m=Math.round((Date.now()-sessStart)/6e4);
    c.textContent=m+' min';
    c.className='pill '+(m>78?'over':'live');
  }else{c.textContent='–';c.className='pill'}
}

/* ═══════════ rest timer ═══════════ */
function startRest(sec,label,next){
  restEnd=Date.now()+sec*1000;
  const el=document.getElementById('rest');
  el.classList.add('show');el.classList.remove('ready');
  document.getElementById('restEx').textContent=label;
  document.getElementById('restNext').textContent=next||'';
  clearInterval(timer);
  const total=sec;
  document.getElementById('restN').textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');
  document.getElementById('restBar').style.width='100%';
  timer=setInterval(()=>{
    const left=Math.max(0,Math.round((restEnd-Date.now())/1000));
    document.getElementById('restN').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
    document.getElementById('restBar').style.width=(left/total*100)+'%';
    if(left<=0){
      el.classList.add('ready');
      document.getElementById('restEx').textContent='GO — '+label;
      clearInterval(timer);
      if(navigator.vibrate)navigator.vibrate([120,60,120]);
      setTimeout(()=>el.classList.remove('show'),6000);
    }
  },250);

}
function skipRest(){clearInterval(timer);document.getElementById('rest').classList.remove('show')}

        <div class="sets">${rows}</div>
        <div class="det"><div class="nt">${x.nt}</div>
          <div class="swap"><span class="swap-l">Station taken?</span>
            ${[x.n,...(x.su||[])].map((alt,vi)=>`<button class="sw${vi===v?' on':''}" onclick="event.stopPropagation();swapTo(${si},${xi},${vi})">${alt}</button>`).join('')}</div>
          <div class="hist" id="h-${si}-${xi}">${histHTML(xid)}</div></div></div>`;
    });
    h+=`</div>`;
  });
  document.getElementById('cnt').innerHTML=h+'</div>';
  paint();
}
function statsHTML(){
  const plan=plannedVol(), act=actualVol(7);
  const order=Object.keys(plan).sort((a,b)=>plan[b]-plan[a]);
  const pct=v=>Math.min(100,v/SCALE*100);
  // only judge the week once most of it has happened — otherwise every
  // Tuesday reads as "under-trained" simply because Sunday hasn't come round
  const logged=weekCounts(1)[0], full=logged>=PROG.length-1;
  const rows=order.map(m=>{
    const p=plan[m], a=act[m]||0;
    const cls = !full ? '' : a<12&&p>=12 ? 'low' : a>20 ? 'high' : '';
    return `<div class="vr"><span class="vm">${m}</span>
      <span class="vtr"><span class="band"></span>
        <span class="fill ${cls}" style="width:${pct(a)}%"></span>
        <span class="plan" style="left:${pct(p)}%"></span></span>
      <span class="vn ${cls}">${a%1?a.toFixed(1):a}<span style="color:var(--t4);font-weight:500">/${p%1?p.toFixed(1):p}</span></span></div>`;
  }).join('');

  const wc=weekCounts(4), tgt=PROG.length;
  const weeks=wc.map((n,i)=>`<div class="${n>=tgt?'good':n>0?'miss':''}">
    <div class="n">${n}</div><div class="l">${i===3?'this wk':(4-i-1)+'w ago'}</div></div>`).join('');

  const bw=bwTrend();
  let bwBody=`<div class="bwrow"><input id="bwIn" type="number" step="0.1" inputmode="decimal"
      placeholder="${bw?bw.latest.w:'kg'}"><button onclick="saveBW()">Log today</button></div>`;
  if(!bw) bwBody+=`<div class="note">Nothing logged yet. Weigh daily, first thing — the daily number is noise, the weekly average is the signal.</div>`;
  else if(bw.rate===undefined) bwBody+=`<div class="big">${n1(bw.latest.w)} kg</div>
      <div class="note">${bw.n} entr${bw.n>1?'ies':'y'} so far. Needs about three weeks before a trend means anything.</div>`;
  else {
    const r=bw.rate, ok=r>=0.25&&r<=0.6;
    bwBody+=`<div class="big">${n1(bw.cur)} kg <span style="font-size:13px;font-weight:600;color:var(--t3)">7-day avg</span></div>
     <div class="note ${ok?'ok':'warn'}">Trending <b>${r>0?'+':''}${n1(r)} kg / month</b>.
     ${ok ? 'That\'s the right rate — roughly a year from 73 to 78 kg, and most of it muscle.'
          : r>0.6 ? 'Too fast. Above ~0.5 kg a month the extra is mostly fat — take 200–300 kcal off.'
          : r<0 ? 'You\'re losing weight. If you meant to be gaining, add 200–300 kcal.'
                : 'Too slow to be gaining. Add about 200 kcal and re-check in two weeks.'}</div>`;
  }

  const st=stalls();
  const stallBody = st.length
    ? st.map(id=>`<div class="stall">${exName(id)} — <b>no gain in 3 sessions</b></div>`).join('')
      +`<div class="note">Stalling on one or two lifts is normal. Half the list stalling at once means the block is done — deload, then start a new one.</div>`
    : `<div class="note ok">Nothing stalled. Every lift with three logged sessions has moved.</div>`;

  return `<div class="dv active">
   <div class="card"><h4>Weekly volume by muscle</h4>
     <div class="cap">Filled bar = sets you actually logged in the last 7 days. The line is what the programme prescribes; the green zone is 12–20 sets, the range a systematic review puts as the working band for trained men.${full?'':' <b>'+logged+' of '+PROG.length+' sessions in so far</b> — colours hold off until the week is nearly done.'}</div>
     ${rows}</div>
   <div class="card"><h4>Consistency</h4>
     <div class="cap">Sessions per week. Early training frequency is the single strongest predictor of whether people stick with lifting at all — it matters more than what any one session contained.</div>
     <div class="wk">${weeks}</div></div>
   <div class="card"><h4>Bodyweight</h4>
     <div class="cap">Target 0.3–0.5 kg per month while gaining.</div>
     ${bwBody}</div>
   <div class="card"><h4>Progression check</h4>
     <div class="cap">Best set (weight × reps) versus three sessions ago.</div>
     ${stallBody}</div></div>`;
}
function saveBW(){const i=document.getElementById('bwIn'),v=i.value.trim();
  if(!v){toast('Enter a weight');return}
  logBW(v);render();toast('Logged '+n1(+v)+' kg')}

function histHTML(id){
  const a=getEx(id).slice(-6).reverse().filter(e=>e.sets.filter(Boolean).length);
  if(!a.length)return '';
  return `<div class="hist-t">Last ${a.length} session${a.length>1?'s':''}</div>`+
    a.map(e=>`<div class="hrow"><span class="hd8">${fmtD(e.d)}</span><span class="hv">${fmtSets(e)}</span></div>`).join('');
}

/* ═══════════ actions ═══════════ */
function swapTo(si,xi,v){setVar(day,si,v);render();toast(v?'Swapped in':'Back to the main lift')}
function mark(si,xi,i){
  const sl=PROG[day].slots[si], x=sl.ex[xi];
  const v=varOf(day,si), xid=variantId(x,v), xn=variantName(x,v);
  const wi=document.getElementById(`w-${si}-${xi}-${i}`), pi=document.getElementById(`p-${si}-${xi}-${i}`);
  const row=document.getElementById(`r-${si}-${xi}-${i}`);
  if(row.classList.contains('done')){
    unlogSet(xid,i);row.classList.remove('done');paint();refreshHist(si,xi);return;
  }
  const w=wi.value.trim()||wi.placeholder, r=pi.value.trim()||pi.placeholder;
  if(!w||!r){toast('Weight and reps first');wi.focus();return}
  wi.value=w;pi.value=r;
  logSet(xid,i,w,r);
  row.classList.add('done');
  const badge=document.querySelector(`#ex-${si}-${xi} .ex-badge`);
  const t=today(xid);
  if(t&&t.sets.filter(Boolean).length>=x.s)badge.classList.add('done');
  refreshHist(si,xi);paint();
  // superset: point at the partner; otherwise the same exercise
  if(i+1<x.s) startRest(sl.rest, xn, x.myo?`then ${i?'another':'the first'} mini-set of 5`:`set ${i+2} of ${x.s}`);
  else skipRest();
  if(sessionSets().done===sessionSets().total)setTimeout(finish,900);
}
function refreshHist(si,xi){
  const el=document.getElementById(`h-${si}-${xi}`);
  const x=PROG[day].slots[si].ex[xi];
  if(el)el.innerHTML=histHTML(variantId(x,varOf(day,si)));
}
function go(i){day=i;render();window.scrollTo({top:0,behavior:'smooth'})}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600)}

/* ═══════════ session summary ═══════════ */
function finish(){
  skipRest();
  if(!PROG[day]){toast('Open a training day first');return}
  const {done,total,stamps}=sessionSets();
  if(!stamps.length){toast('Nothing logged today');return}
  const mins=Math.max(1,Math.round((stamps[stamps.length-1]-stamps[0])/6e4));
  const gaps=[];for(let i=1;i<stamps.length;i++){const g=(stamps[i]-stamps[i-1])/1000;if(g<600)gaps.push(g)}
  const avg=gaps.length?Math.round(gaps.reduce((a,b)=>a+b)/gaps.length):0;
  let tgt=0,tn=0;
  PROG[day].slots.forEach(sl=>sl.ex.forEach(x=>{tgt+=sl.rest*x.s;tn+=x.s}));
  const tgtAvg=Math.round(tgt/tn)+40;         // prescribed gap + ~40 s for the set itself
  const over=avg-tgtAvg, lost=Math.round(over*gaps.length/60);
  const w=x=>Math.floor(x/60)+':'+String(x%60).padStart(2,'0');
  document.getElementById('sheetIn').innerHTML=`
   <h3>${PROG[day].lb}</h3><div class="sub">${done} of ${total} sets logged</div>
   <div class="stat-g">
     <div class="stat"><div class="k">Session</div><div class="v">${mins} min</div><div class="n">first set to last</div></div>
     <div class="stat"><div class="k">Sets done</div><div class="v">${done}/${total}</div><div class="n">${Math.round(done/total*100)}% of the plan</div></div>
     <div class="stat"><div class="k">Avg per set</div><div class="v">${w(avg)}</div><div class="n">work + rest</div></div>
     <div class="stat"><div class="k">Target</div><div class="v">${w(tgtAvg)}</div><div class="n">prescribed pace</div></div>
   </div>
   ${over>25
     ? `<div class="verdict warn">You're running <b>${w(over)} slower per set</b> than prescribed — about <b>${lost} minutes</b> added to this session. That's rest drift, not the program. Let the timer run the rests and this session becomes ~${Math.max(30,mins-lost)} min.</div>`
     : over<-20
     ? `<div class="verdict">You're resting <b>${w(-over)} less per set</b> than prescribed. Under 60 s between sets costs a little growth — let the timer finish.</div>`
     : `<div class="verdict">Pace is on target. This session's length is the <b>programme</b>, not your rests — if it's still too long, that's a volume decision, not a timing one.</div>`}
   <button class="btn" onclick="document.getElementById('sheet').classList.remove('show')">Done</button>`;
  document.getElementById('sheet').classList.add('show');
}
function exportJSON(){
  const out={exported:new Date().toISOString(),blockStart:J(KB,null),bodyweight:J(KBW,[]),log:{}};
  for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);
    if(k.startsWith(K)&&k!==KB&&k!==KBW)out.log[k.slice(K.length)]=J(k,[])}
  const s=JSON.stringify(out,null,1);
  navigator.clipboard?.writeText(s).then(()=>toast('Copied to clipboard'),()=>{});
  const win=window.open('','_blank');
  if(win){win.document.write('<pre style="font:12px/1.4 monospace;white-space:pre-wrap;word-break:break-all">'+
    s.replace(/[<&]/g,c=>({'<':'&lt;','&':'&amp;'}[c]))+'</pre>');win.document.close()}
  else toast('Copied — paste somewhere safe');
}
function newBlock(){
  if(!confirm('Start a new 4-week block from today? Your logged weights are kept.'))return;
  W(KB,dk());render();toast('Week 1');
}

/* ═══════════ boot ═══════════ */
const dm={2:0,3:1,5:2,6:3,0:4};
day=dm[new Date().getDay()]??0;
render();
setInterval(paint,30000);
document.getElementById('sheet').addEventListener('click',e=>{
  if(e.target.id==='sheet')e.currentTarget.classList.remove('show')});
</script>
</body>
</html>
