<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym">
<meta name="theme-color" content="#ffffff">
<title>Hypertrophy Program</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

:root {
  --bg: #f5f5f7;
  --white: #ffffff;
  --text: #1d1d1f;
  --text2: #424245;
  --text3: #86868b;
  --border: #e5e5ea;
  --blue: #007aff;
  --blue-bg: #eef4ff;
  --green: #30d158;
  --green-bg: #edfcf0;
  --orange: #ff9f0a;
  --orange-bg: #fff8eb;
  --purple: #af52de;
  --purple-bg: #f8f0fc;
  --red: #ff3b30;
  --red-bg: #fff0ef;
  --radius: 14px;
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-lg: 0 4px 12px rgba(0,0,0,0.08);
}

* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  padding-bottom: 72px;
}

/* Header */
.header {
  background: var(--white);
  padding: 48px 20px 20px;
  text-align: center;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 50;
}
.header h1 {
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -0.5px;
  color: var(--text);
}
.header p {
  font-size: 13px;
  color: var(--text3);
  margin-top: 2px;
}

/* Day tabs */
.tabs {
  display: flex;
  gap: 6px;
  padding: 12px 16px;
  background: var(--white);
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  position: sticky;
  top: 78px;
  z-index: 49;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex-shrink: 0;
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text3);
  background: var(--bg);
  border: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: all 0.2s;
}
.tab.active {
  background: var(--blue);
  color: white;
}
.tab.today::after {
  content: '';
  display: inline-block;
  width: 5px;
  height: 5px;
  background: var(--green);
  border-radius: 50%;
  margin-left: 5px;
  vertical-align: middle;
}

/* Content */
.content { padding: 12px 16px; }
.day-view { display: none; }
.day-view.active { display: block; }

/* Exercise card */
.ex-card {
  background: var(--white);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 8px;
  box-shadow: var(--shadow);
  border-left: 4px solid transparent;
}
.ex-card.pri { border-left-color: var(--blue); }
.ex-card.addon { border-left-color: var(--purple); background: var(--purple-bg); }

.ex-num {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  border-radius: 7px;
  background: var(--blue-bg);
  color: var(--blue);
  font-size: 11px;
  font-weight: 700;
  margin-right: 8px;
  flex-shrink: 0;
}
.ex-card.addon .ex-num {
  background: var(--purple-bg);
  color: var(--purple);
}

.ex-top {
  display: flex;
  align-items: flex-start;
}
.ex-name {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -0.2px;
  line-height: 1.3;
  flex: 1;
}
.ex-card.addon .ex-name { font-size: 14px; color: var(--purple); }

/* Stats chips */
.ex-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 10px 0;
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 5px 10px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 600;
  background: var(--bg);
}
.chip .lbl {
  font-weight: 500;
  color: var(--text3);
  font-size: 11px;
}
.chip.tech {
  background: var(--red-bg);
  color: var(--red);
}

/* Notes */
.ex-notes {
  font-size: 13px;
  color: var(--text2);
  line-height: 1.55;
  margin-top: 6px;
}
.ex-sub {
  font-size: 12px;
  color: var(--text3);
  margin-top: 6px;
  padding-top: 6px;
  border-top: 1px solid var(--border);
}
.ex-sub span { font-weight: 600; color: var(--text3); }

/* Addon separator */
.addon-sep {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 16px 0 10px;
  font-size: 12px;
  font-weight: 700;
  color: var(--purple);
  text-transform: uppercase;
  letter-spacing: 0.8px;
}
.addon-sep::after {
  content: '';
  flex: 1;
  height: 1px;
  background: rgba(175,82,222,0.2);
}

/* Reference section */
.ref-section {
  margin-top: 16px;
}
.ref-card {
  background: var(--white);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
  margin-bottom: 8px;
}
.ref-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.ref-header h3 {
  font-size: 15px;
  font-weight: 700;
}
.ref-arrow {
  width: 18px; height: 18px;
  color: var(--text3);
  transition: transform 0.2s;
}
.ref-card.open .ref-arrow { transform: rotate(180deg); }
.ref-body {
  display: none;
  padding: 0 16px 14px;
}
.ref-card.open .ref-body { display: block; }
.ref-item {
  font-size: 13px;
  color: var(--text2);
  line-height: 1.6;
  margin-bottom: 8px;
  padding-left: 12px;
  border-left: 2px solid var(--border);
}
.ref-item strong { color: var(--text); }

/* Footer note */
.footer-note {
  text-align: center;
  padding: 20px 16px;
  font-size: 11px;
  color: var(--text3);
}
</style>
</head>

let addonNum = 0;

document.getElementById('content').innerHTML = DAYS.map((d, di) => {
  mainNum = 0; addonNum = 0;
  let inAddon = false;
  const exHTML = d.exercises.map(ex => {
    if (ex.n === "__SEP__") { inAddon = true; addonNum = 0; return `<div class="addon-sep">Add-ons · 30-45s rest</div>`; }
    if (!inAddon) mainNum++; else addonNum++;
    const num = inAddon ? `A${addonNum}` : mainNum;
    const cls = ex.pri ? 'pri' : (ex.addon ? 'addon' : '');
    const techChip = ex.tech ? `<div class="chip tech">${ex.tech}</div>` : '';
    const subHTML = ex.sub && ex.sub !== '—' ? `<div class="ex-sub"><span>Sub:</span> ${ex.sub}</div>` : '';
    return `
      <div class="ex-card ${cls}">
        <div class="ex-top">
          <div class="ex-num">${num}</div>
          <div class="ex-name">${ex.n}</div>
        </div>
        <div class="ex-chips">
          <div class="chip"><span class="lbl">Sets</span> ${ex.s}</div>
          <div class="chip"><span class="lbl">Reps</span> ${ex.r}</div>
          <div class="chip"><span class="lbl">RPE</span> ${ex.rpe}</div>
          <div class="chip"><span class="lbl">Rest</span> ${ex.rest}</div>
          ${techChip}
        </div>
        <div class="ex-notes">${ex.notes}</div>
        ${subHTML}
      </div>`;
  }).join('');
  return `<div class="day-view" id="day-${di}"><div style="margin-bottom:6px;padding:2px 0"><span style="font-size:11px;color:var(--text3);font-weight:500">${d.label}</span></div>${exHTML}</div>`;
}).join('');

// Reference
document.getElementById('ref-section').innerHTML = `<div class="day-view" id="day-ref">${REFS.map(r => `
  <div class="ref-card" onclick="this.classList.toggle('open')">
    <div class="ref-header">
      <h3>${r.title}</h3>
      <svg class="ref-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
    </div>
    <div class="ref-body">
      ${r.items.map(i => `<div class="ref-item">${i}</div>`).join('')}
    </div>
  </div>`).join('')}</div>`;

function showDay(i) {
  document.querySelectorAll('.day-view').forEach(d => d.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('day-'+i).classList.add('active');
  document.getElementById('tab-'+i).classList.add('active');
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function showRef() {
  document.querySelectorAll('.day-view').forEach(d => d.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('day-ref').classList.add('active');
  document.getElementById('tab-ref').classList.add('active');
  window.scrollTo({top: 0, behavior: 'smooth'});
}

// Auto-open today
const dayMap = {2:0, 3:1, 5:2, 6:3, 0:4};
showDay(dayMap[today] !== undefined ? dayMap[today] : 0);
</script>
</body>
</html>
