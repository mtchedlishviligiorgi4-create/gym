 block:6,               // beginners: six building weeks, then the deload week
 overMin:70,
 band:[8,14],           // weekly sets per muscle, green zone on the stats tab
 bandNote:'the green zone is 8–14 sets — plenty for a first year of lifting, where every set still pays well.',
 bw:{lo:-.2,hi:.5,cap:'Target: hold steady or gain up to 0.5 kg a month. A beginner builds muscle at that.',
  msg:(r,ok)=>ok ? 'Right where it should be. At this stage the muscle comes from the training, not from eating a lot more.'
          : r>.5 ? 'Gaining faster than muscle can be built — take about 150 kcal off.'
                 : 'Losing weight. If that isn\'t the plan, add about 150–200 kcal — protein first.'},
 /* her first app saved one weight per exercise under positional keys
    (hg_<day>_<index>). Copy those weights onto the new stable ids once,
    so the first session shows what she lifted last time. Old keys are kept. */
 migrate(){
  if(localStorage.getItem(K+'migrated'))return;
  const MAP={0:{0:'leg-press',1:'hip-thrust',2:'reverse-lunge',3:'leg-extension',4:'hip-abduction',5:'standing-calf',7:'db-lateral'},
   1:{0:'lat-pulldown-wide',1:'seated-cable-row',2:'machine-shoulder-press',3:'lateral-raise-machine',4:'reverse-pec-deck',5:'machine-chest-press',6:'cable-pushdown',7:'incline-db-curl',9:'hip-abduction',10:'cable-kickback'},
   2:{0:'smith-rdl',1:'hip-thrust-heavy',2:'leg-press-glute',3:'seated-leg-curl',4:'leg-extension',5:'standing-calf'},
   3:{0:'neutral-pulldown',1:'chest-supported-row',2:'machine-incline-press',3:'db-lateral',4:'reverse-pec-deck',5:'cable-pushdown',6:'incline-db-curl',8:'seated-leg-curl',9:'hip-abduction'}};
  for(const di in MAP)for(const ei in MAP[di]){
   const old=J(`hg_${di}_${ei}`,[]); if(!old.length)continue;
   const id=MAP[di][ei], a=getEx(id);
   old.forEach(o=>{if(o&&o.w&&!a.some(e=>e.d===o.d))a.push({d:o.d,sets:[{w:+o.w,r:0}],ts:[]})});
   a.sort((x,y)=>x.d<y.d?-1:1); W(K+id,a);
  }
  W(K+'migrated',dk());
 },
};

{t:"🏟️ How the app works",i:[
 "<strong>One station at a time.</strong> Every exercise is straight sets on one machine, cable or pair of dumbbells. Nothing to hold while you walk across the gym.",

{t:"📈 Progression",i:[
 "<strong>Double progression.</strong> Use a weight where the last rep is slow but clean. When every set reaches the TOP of the rep range, add the smallest step next time (usually 2.5 kg for legs, 1–2 kg for arms and shoulders). The ▲ on a card means you've earned it.",
 "<strong>Weeks 1–2: learn the movements.</strong> Start lighter than you think. Doing 2 sets instead of 3 while you're still sore is fine.",
 "<strong>Six weeks, then a deload week</strong>: same weights, half the sets. The header counts the weeks for you.",
 "Nothing to rate or judge — reps are counted, that's it."]},
{t:"🎯 Why it's laid out this way",i:[
 "<strong>Glutes come first:</strong> about 13 sets a week across hip thrusts, RDLs, lunges, kickbacks and the wide leg press, plus 6 sets of abduction. Hamstrings about 9, quads about 10.",

 "<strong>Exercises loaded in the stretch</strong> where there is a choice — seated leg curl, RDL, incline curl, overhead triceps. That position grows muscle best.",
 "<strong>At least 60 s rest</strong> between sets. Shorter rest costs reps on the next set, and the reps are what build the muscle."]},
{t:"🍗 Nutrition",i:[
