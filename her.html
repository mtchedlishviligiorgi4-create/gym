<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Her Gym</title>

<body>

<div class="hd">
  <div class="hd-top">
    <div class="hd-t">HER GYM <span id="wk">Week 1</span></div>
    <div class="hd-meta">
      <div class="pill" id="clock">–</div>
      <div class="pill" id="count">0/0</div>
    </div>
  </div>
  <div class="prog"><i id="progbar"></i></div>
  <div class="tabs" id="tabs"></div>
</div>

<div class="cnt" id="cnt"></div>

<div class="rest" id="rest">
  <div class="rest-n" id="restN">0:00</div>
  <div class="rest-i"><b id="restEx">—</b><span id="restNext">next up</span></div>
  <button class="rest-x" onclick="skipRest()">SKIP</button>
  <div class="rest-bar" id="restBar"></div>
</div>

<div class="sheet" id="sheet"><div class="sheet-in" id="sheetIn"></div></div>
<div class="toast" id="toast"></div>

<script>
/* Per-person settings. The app itself is engine.js, shared with index.html,
   so a fix to the app lands in both. */
const CFG={
 key:'herv2:',          // localStorage prefix — never change, it holds the log
 block:6,               // beginners: six building weeks, then the deload week
 overMin:60,
 band:[6,22],           // weekly sets per muscle, green zone on the stats tab
 bandNote:'the green zone is 6–22 sets. Glutes sit at the top of it on purpose; the upper body sits low on purpose.',
 bw:{lo:-.4,hi:.3,cap:'Target: roughly steady. Glutes grow from the training and protein, not from a surplus — a surplus goes to the stomach first.',
  msg:(r,ok)=>ok ? 'Steady — right where it should be. Watch the waist and hip measurements, not the scale.'
          : r>.3 ? 'Gaining faster than the glutes can use it — take about 150 kcal off.'
                 : 'Losing more than planned. Add about 150 kcal — protein first — so the glutes have something to grow with.'},
 /* her first app saved one weight per exercise under positional keys
    (hg_<day>_<index>). Copy those weights onto the new stable ids once,
    so the first session shows what she lifted last time. Old keys are kept. */
 migrate(){
  if(localStorage.getItem(K+'migrated'))return;
  const MAP={0:{0:'leg-press',1:'hip-thrust',2:'reverse-lunge',3:'leg-extension',4:'hip-abduction',5:'standing-calf',7:'db-lateral'},
   1:{0:'lat-pulldown-wide',1:'seated-cable-row',2:'machine-shoulder-press',3:'lateral-raise-machine',4:'reverse-pec-deck',5:'machine-chest-press',6:'cable-pushdown',7:'incline-db-curl',9:'hip-abduction',10:'cable-kickback'},
   2:{0:'smith-rdl',1:'hip-thrust-heavy',2:'leg-press-glute',3:'seated-leg-curl',4:'leg-extension',5:'standing-calf'},
   3:{0:'neutral-pulldown',1:'chest-supported-row',2:'machine-incline-press',3:'db-lateral',4:'reverse-pec-deck',5:'cable-pushdown',6:'incline-db-curl',8:'seated-leg-curl',9:'hip-abduction'}};
  for(const di in MAP)for(const ei in MAP[di]){
   const old=J(`hg_${di}_${ei}`,[]); if(!old.length)continue;
   const id=MAP[di][ei], a=getEx(id);
   old.forEach(o=>{if(o&&o.w&&!a.some(e=>e.d===o.d))a.push({d:o.d,sets:[{w:+o.w,r:0}],ts:[]})});
   a.sort((x,y)=>x.d<y.d?-1:1); W(K+id,a);
  }
  W(K+'migrated',dk());
 },
};

const REFS=[
{t:"🍑 The goal: big glutes, flat stomach, hourglass",i:[

 "<strong>Shoulders: nothing that widens them.</strong> No lateral raises, no shoulder press, no wide-grip pulldown. The upper days keep posture and balance — shoulders back, chest open — which already makes the waist look smaller.",
 "<strong>Thighs:</strong> the lunges and leg press still work them, but there is no leg extension. The leg work is chosen to load the glutes."]},
{t:"⏳ Flat stomach",i:[
 "<strong>A flat stomach is mostly body fat and bloating, not ab training.</strong> Crunching doesn't burn the fat over the belly — fat comes off where it comes off, which is why nutrition below matters most.",
 "<strong>What training adds:</strong> dead bugs train the deep core that keeps the belly held in, and crunches build the abs underneath. Nothing here thickens the waist — weighted side bends are left out on purpose.",
 "<strong>Walk.</strong> 20–30 min of incline walking after the Tuesday and Friday sessions, or 8–10k steps a day. It helps keep body fat down without getting in the way of the glutes.",
 "Stomach vacuums have no evidence for a smaller waist — skip them."]},
{t:"🍗 Nutrition",i:[
 "<strong>Eat at maintenance — not in a surplus.</strong> As a beginner she can build glutes and lose a little fat at the same time. A surplus would grow the glutes slightly faster, but it puts fat on the stomach first.",
 "<strong>Protein 1.6–2 g per kg of bodyweight</strong> every day (60 kg → about 100–120 g), spread over 3–4 meals. This is what lets the glutes grow without extra calories.",
 "<strong>Bodyweight should hold roughly steady.</strong> The stats tab averages it. If the waist tape measure goes down and the hip measure goes up while the scale stays put, it's working.",

 "Measure the waist (at the belly button) and the hips (widest point) every two weeks. They're the numbers that show the hourglass, better than the scale."]},
{t:"📈 Progression",i:[

 "<strong>Weeks 1–2: learn the movements</strong> and start lighter than you think. Doing a set fewer while still sore is fine.",
